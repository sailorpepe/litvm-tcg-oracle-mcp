# Publish to PyPI with Trusted Publishing (OIDC): no API token exists anywhere.
# PyPI trusts this exact repo + workflow + environment, configured once at
# https://pypi.org/manage/project/litvm-tcg-oracle/settings/publishing/
# Release = bump the version in pyproject.toml, then push a tag v<version>.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $v"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
